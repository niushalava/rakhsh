<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inkbound — draw the way home</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0d0b1e; overflow: hidden; }
      #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
      canvas { display: block; background: #0d0b1e; cursor: crosshair; }
      #status { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
