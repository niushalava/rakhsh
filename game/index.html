<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Lumink — draw the way home</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #060412; overflow: hidden; }
      #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
      canvas { display: block; background: #060412; cursor: crosshair; touch-action: none; }
      #status { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
      #rotate-hint { display: none; position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #b8b3d9; font: 600 14px system-ui, sans-serif; pointer-events: none; z-index: 5; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: block; } }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
    <div id="rotate-hint">📱 Rotate your phone — the game plays best sideways</div>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
